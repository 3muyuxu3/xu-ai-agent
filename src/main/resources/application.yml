spring:
  application:
    name: xu-ai-agent
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536  # 维度
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.muyu.xuaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 定义日志级别
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
